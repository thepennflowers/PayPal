# Declarative catalog for The Penn Flowers.
# Applied to a real PayPal account with: npm run paypal:apply
# (dry-run first with: npm run paypal:plan)
#
# Keep `id` stable once created — it's used to match existing PayPal
# catalog products on re-apply (idempotent upsert by name if id is new).
products:
  - id: PROD-SIGNATURE-ROSE
    name: Signature Rose Bouquet
    description: A dozen long-stem roses, hand-tied with eucalyptus.
    type: PHYSICAL
    category: bouquet
    price:
      currency_code: USD
      value: "68.00"

  - id: PROD-SEASONAL-MIX
    name: Seasonal Wildflower Mix
    description: Whatever's freshest this week from our local growers.
